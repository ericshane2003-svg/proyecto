<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta Pública</title>
    <link rel="stylesheet" href="../Assets/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Regístrate</h2>
        <form id="formPublico">
            <input type="text" name="usuario" placeholder="Tu usuario" required style="margin-bottom:10px;">
            <input type="password" name="password" placeholder="Tu clave" required style="margin-bottom:10px;">
            
            <label style="display:block; text-align:left; font-size:12px; color:#666;">Selecciona tu rol:</label>
            <select name="rol" required style="width: 100%; padding: 10px; margin-bottom:15px;">
                <option value="2">Cliente</option>
                <option value="3">Invitado</option>
            </select>

            <button type="submit" class="Ingresar">Crear mi cuenta</button>
        </form>
        <br>
        <a href="index.html" style="font-size:14px; color:blue; text-decoration:none;">Ya tengo cuenta</a>
    </div>

    <script>
        document.getElementById('formPublico').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('../Controlador/registrar.php', {
                method: 'POST',
                body: new FormData(this)
            })
            .then(r => r.json())
            .then(d => {
                alert(d.mensaje);
                if(d.status === 'success') window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
