<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 15px; background: white; }
        .icono-gato { width: 100px; height: 100px; object-fit: cover; display: block; margin: 0 auto 20px; }
    </style>
</head>
<body>

<div class="card login-card shadow-sm">
    <div class="card-body">
        <img class="icono-gato rounded-circle" src="../Assets/image.png" alt="Bienvenida">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        
        <form id="formularioLogin" method="POST">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario:</label>
                <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Ej: admin" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                    <button type="button" id="ver" class="btn btn-outline-secondary">Ver</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Ingresar al Sistema</button>
        </form>
        
        <div class="text-center mt-3">
            <p class="mb-0">¿No tienes cuenta?</p>
            <a href="registro.html" class="text-decoration-none fw-bold">Regístrate aquí</a>
        </div>
    </div>
</div>

<script>
    // Lógica para ver/ocultar contraseña
    document.getElementById('ver').addEventListener('click', function() {
        const pass = document.getElementById('password');
        if (pass.type === "password") {
            pass.type = "text";
            this.innerText = "Ocultar";
        } else {
            pass.type = "password";
            this.innerText = "Ver";
        }
    });

    // Lógica de envío (AJAX)
    document.getElementById('formularioLogin').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        
        fetch('../Controlador/login.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.href = 'panel.php';
            } else {
                alert(data.mensaje);
            }
        })
        .catch(error => console.error('Error:', error));
    });
</script>

</body>
</html>
